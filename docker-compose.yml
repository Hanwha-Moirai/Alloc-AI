services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_PDF_SERVICE_URL: http://pdf:8010
    depends_on:
      - qdrant
      - pdf
    restart: unless-stopped

  pdf:
    build:
      context: ./pdf
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    restart: unless-stopped

volumes:
  qdrant_data:
