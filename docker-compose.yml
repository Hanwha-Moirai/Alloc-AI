services:
  qdrant:
    # 벡터 검색용 Qdrant 서비스
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  rag:
    # RAG API 서버 (FastAPI)
    build:
      context: ./rag
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - ./certs/ap-northeast-2-bundle.pem:/certs/ap-northeast-2-bundle.pem:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health/qdrant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
