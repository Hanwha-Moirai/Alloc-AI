services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health/qdrant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
